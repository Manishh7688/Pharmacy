<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050B09" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vialEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="vialAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="helixBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#050B09"/>
  <circle cx="420" cy="290" r="320" fill="url(#bgGlow)"/>

  <!-- Architectural Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Emerald Glass Vial Left -->
  <g transform="translate(150, 210)">
    <rect x="24" y="0" width="72" height="18" rx="4" fill="#334155" stroke="#94A3B8" stroke-opacity="0.4"/>
    <rect x="34" y="18" width="52" height="16" fill="#1E293B"/>
    <rect x="10" y="34" width="100" height="210" rx="18" fill="url(#vialEmerald)" stroke="#6EE7B7" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="22" y="48" width="12" height="180" rx="6" fill="#ffffff" fill-opacity="0.18"/>
    <line x1="10" y1="110" x2="110" y2="110" stroke="#A7F3D0" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  </g>

  <!-- Amber Glass Vial Right -->
  <g transform="translate(540, 230)">
    <rect x="24" y="0" width="72" height="18" rx="4" fill="#475569" stroke="#CBD5E1" stroke-opacity="0.4"/>
    <rect x="34" y="18" width="52" height="16" fill="#1E293B"/>
    <rect x="10" y="34" width="100" height="190" rx="18" fill="url(#vialAmber)" stroke="#FCD34D" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="22" y="48" width="12" height="160" rx="6" fill="#ffffff" fill-opacity="0.18"/>
  </g>

  <!-- Luminous Double Helix Center -->
  <g transform="translate(330, 70)">
    <path d="M20,20 C130,90 -10,180 110,260 C210,330 10,410 120,460" stroke="url(#helixBeam)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M120,20 C10,90 150,180 30,260 C-70,330 130,410 20,460" stroke="#34D399" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <g stroke="#A7F3D0" stroke-opacity="0.45" stroke-width="2">
      <line x1="45" y1="55" x2="95" y2="55"/>
      <line x1="58" y1="95" x2="82" y2="95"/>
      <line x1="42" y1="145" x2="98" y2="145"/>
      <line x1="35" y1="185" x2="105" y2="185"/>
      <line x1="55" y1="225" x2="85" y2="225"/>
      <line x1="45" y1="295" x2="95" y2="295"/>
      <line x1="35" y1="340" x2="105" y2="340"/>
      <line x1="50" y1="385" x2="90" y2="385"/>
    </g>
    <circle cx="45" cy="55" r="5" fill="#6EE7B7"/>
    <circle cx="98" cy="145" r="5" fill="#FBBF24"/>
    <circle cx="35" cy="185" r="5" fill="#34D399"/>
    <circle cx="95" cy="295" r="5" fill="#6EE7B7"/>
    <circle cx="105" cy="340" r="5" fill="#FBBF24"/>
  </g>
</svg>
